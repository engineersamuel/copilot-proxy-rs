[tools]
process-compose = "1.124.0"

[env]
COPILOT_PROXY_RS_PC_SOCKET = "{{ env.COPILOT_PROXY_RS_PC_SOCKET | default(value=config_root ~ '/.process-compose/pc.sock') }}"

[tasks."proxy:up"]
description = "Build and start the proxy, waiting for readiness"
shell = "bash -c"
run = 'bash scripts/proxy-up.sh'

[tasks."proxy:down"]
description = "Stop the proxy and its supervisor"
shell = "bash -c"
run = '''
set -euo pipefail
for name in $(compgen -v PC_); do unset "$name"; done
process-compose -U -u "$COPILOT_PROXY_RS_PC_SOCKET" -L .process-compose/process-compose.log down
'''

[tasks."proxy:restart"]
description = "Restart only the supervised proxy process"
shell = "bash -c"
run = '''
set -euo pipefail
for name in $(compgen -v PC_); do unset "$name"; done
process-compose -U -u "$COPILOT_PROXY_RS_PC_SOCKET" -L .process-compose/process-compose.log process restart proxy
'''

[tasks."proxy:status"]
description = "Show the supervised proxy status"
shell = "bash -c"
run = '''
set -euo pipefail
for name in $(compgen -v PC_); do unset "$name"; done
process-compose -U -u "$COPILOT_PROXY_RS_PC_SOCKET" -L .process-compose/process-compose.log process list --output wide
'''

[tasks."proxy:logs"]
description = "Show the last 50 proxy log lines"
shell = "bash -c"
run = '''
set -euo pipefail
for name in $(compgen -v PC_); do unset "$name"; done
process-compose -U -u "$COPILOT_PROXY_RS_PC_SOCKET" -L .process-compose/process-compose.log process logs proxy --tail 50
'''
