[tools]
process-compose = "1.124.0"

[tasks."proxy:up"]
description = "Start the native proxy detached and wait for readiness"
run = "scripts/proxy-compose.sh up"

[tasks."proxy:down"]
description = "Stop this worktree's native proxy"
run = "scripts/proxy-compose.sh down"

[tasks."proxy:restart"]
description = "Restart the managed proxy and wait for readiness"
run = "scripts/proxy-compose.sh restart"

[tasks."proxy:status"]
description = "Show the managed proxy's status and readiness"
run = "scripts/proxy-compose.sh status"

[tasks."proxy:logs"]
description = "Show the last 100 proxy log lines"
run = "scripts/proxy-compose.sh logs"
