[tools]
process-compose = "1.124.0"

[tasks."proxy:up"]
description = "Start the native proxy detached and wait for readiness"
run = "scripts/proxy-compose.sh up"
run_windows = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\proxy-compose.ps1 up'

[tasks."proxy:down"]
description = "Stop this worktree's native proxy"
run = "scripts/proxy-compose.sh down"
run_windows = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\proxy-compose.ps1 down'

[tasks."proxy:restart"]
description = "Restart the managed proxy and wait for readiness"
run = "scripts/proxy-compose.sh restart"
run_windows = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\proxy-compose.ps1 restart'

[tasks."proxy:status"]
description = "Show the managed proxy's status and readiness"
run = "scripts/proxy-compose.sh status"
run_windows = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\proxy-compose.ps1 status'

[tasks."proxy:logs"]
description = "Show the last 100 proxy log lines"
run = "scripts/proxy-compose.sh logs"
run_windows = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\proxy-compose.ps1 logs'

[tasks."proxy:tui"]
description = "Open the proxy status and live logs TUI; q exits without stopping services"
quiet = true
raw = true
run = "scripts/proxy-compose.sh tui"
run_windows = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\proxy-compose.ps1 tui'
