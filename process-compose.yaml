version: "0.5"

log_level: info

processes:
  proxy:
    command: "cargo run --release --locked --bin copilot-proxy-rs"
    environment:
      - "COPILOT_PROXY_RS_HOST=${COPILOT_PROXY_RS_HOST:-127.0.0.1}"
      - "COPILOT_PROXY_RS_PORT=${COPILOT_PROXY_RS_PORT:-8080}"
      - "COPILOT_PROXY_RS_LOG_FAILED_REQUEST_BODIES=false"
      - "RUST_LOG=${RUST_LOG:-info}"
    log_location: tmp/pc/logs/proxy.log
    log_configuration:
      no_color: true
      disable_json: true
      no_metadata: true
      rotation:
        max_size_mb: 10
        max_age_days: 7
        max_backups: 3
        compress: true
    readiness_probe:
      http_get:
        host: "${COPILOT_PROXY_RS_HOST:-127.0.0.1}"
        port: ${COPILOT_PROXY_RS_PORT:-8080}
        path: /health
      period_seconds: 1
      timeout_seconds: 1
      failure_threshold: 600
    shutdown:
      signal: 15
      timeout_seconds: 10
