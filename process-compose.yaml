version: "0.5"

processes:
  proxy:
    command: target/debug/copilot-proxy-rs
    environment:
      - COPILOT_PROXY_RS_PORT=${COPILOT_PROXY_RS_PORT:-8080}
      - RUST_LOG=info
    log_location: .run/proxy-${COPILOT_PROXY_RS_PORT:-8080}.log
    readiness_probe:
      http_get:
        host: 127.0.0.1
        path: /health
        port: ${COPILOT_PROXY_RS_PORT:-8080}
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 30
