version: "0.5"

processes:
  copilot-proxy-rs:
    command: exec ./target/release/copilot-proxy-rs
    environment:
      - "COPILOT_PROXY_RS_HOST=${COPILOT_PROXY_RS_HOST:-127.0.0.1}"
      - "COPILOT_PROXY_RS_PORT=${COPILOT_PROXY_RS_PORT:-8080}"
      - "RUST_LOG=${RUST_LOG:-info}"
    log_location: .process-compose/copilot-proxy-rs.log
    log_configuration:
      rotation:
        max_size_mb: 10
        max_backups: 3
        max_age_days: 7
        compress: true
    readiness_probe:
      http_get:
        host: "${COPILOT_PROXY_RS_HOST:-127.0.0.1}"
        port: "${COPILOT_PROXY_RS_PORT:-8080}"
        path: /health
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 2
      success_threshold: 1
      failure_threshold: 120
    availability:
      restart: on_failure
      backoff_seconds: 2
      max_restarts: 5
    shutdown:
      signal: 15
      timeout_seconds: 10
